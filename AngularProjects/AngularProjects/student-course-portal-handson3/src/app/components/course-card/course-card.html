<div
  class="course-card"
  appHighlight="lightblue"
  [ngClass]="cardClasses"
  [ngStyle]="{
    'border-left-color': borderColor
  }">

  <h3>{{ course.name }}</h3>

  <p><strong>ID:</strong> {{ course.id }}</p>
  <p><strong>Code:</strong> {{ course.code }}</p>

  <p>
    <strong>Credits:</strong>
    {{ course.credits | creditLabel }}
  </p>

  <div [ngSwitch]="course.gradeStatus">
    <span *ngSwitchCase="'passed'" class="badge passed">
      Passed
    </span>

    <span *ngSwitchCase="'failed'" class="badge failed">
      Failed
    </span>

    <span *ngSwitchDefault class="badge pending">
      Pending
    </span>
  </div>

  <br>

  <button (click)="toggleDetails()">
    {{ isExpanded ? 'Hide Details' : 'Show Details' }}
  </button>

  <div *ngIf="isExpanded" class="details">
    <p>
      This course contains structured lessons,
      assignments and practical exercises.
    </p>

    <p>
      Enrollment Status:
      {{ course.enrolled ? 'Enrolled' : 'Not Enrolled' }}
    </p>
  </div>
</div>
